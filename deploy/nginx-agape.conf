# ============================================================
# Nginx config: simap project at "/", Agape Family Foundation at "/agape/"
# on the same server (98.88.75.67). Put this in your Nginx sites config
# (e.g. /etc/nginx/sites-available/default or a new file included by nginx.conf),
# then: sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name 98.88.75.67;

    # ---- simap project (unchanged) ----
    # Leave whatever you already have here for simap. Example if it's also
    # a local Node/Python app on another port:
    # location / {
    #     proxy_pass http://127.0.0.1:4000;   # <-- simap's real port
    #     proxy_set_header Host $host;
    # }

    # ---- Agape Family Foundation, served under /agape/ ----
    # The trailing slash on both the location and proxy_pass is what strips
    # "/agape" before it reaches the Node app, so server.js keeps seeing
    # plain paths like /control, /api/content, /pages/admin.html.
    location /agape/ {
        proxy_pass http://127.0.0.1:3000/;

        # REQUIRED: server.js reads this to know its own public prefix, so it
        # can prefix uploaded-image URLs and the admin-session cookie's Path
        # correctly. Without this line, admin login and images will break
        # under the /agape/ subpath even though everything works on localhost.
        proxy_set_header X-Forwarded-Prefix /agape;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cookies use SameSite=Strict, so this must be a normal HTTP proxy,
        # not a redirect — this config already does that correctly.
    }

    # Redirect bare "/agape" (no trailing slash) to "/agape/" so relative
    # asset paths on the homepage resolve correctly.
    location = /agape {
        return 301 /agape/;
    }
}
